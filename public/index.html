<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Расчёт начинки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E9EAE3; --card:#FCFCFA; --ink:#24201C; --ink-soft:#6B655D;
  --hair:#CFCEC4; --cocoa:#3E2517; --cocoa-soft:#6A4530;
  --lcd:#C6CCBA; --lcd-ink:#1E2A20; --danger:#9C3A28; --ok:#2F6B45; --focus:#3E2517;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#191613; --card:#221E1A; --ink:#EDE8E1; --ink-soft:#9C9389;
    --hair:#3A332C; --cocoa:#E3D3C5; --cocoa-soft:#B39A85;
    --lcd:#2C3A2E; --lcd-ink:#CFDDC8; --danger:#D97A66; --ok:#8FC2A2; --focus:#E3D3C5;
  }
}
:root[data-theme="dark"]{
  --paper:#191613; --card:#221E1A; --ink:#EDE8E1; --ink-soft:#9C9389;
  --hair:#3A332C; --cocoa:#E3D3C5; --cocoa-soft:#B39A85;
  --lcd:#2C3A2E; --lcd-ink:#CFDDC8; --danger:#D97A66; --ok:#8FC2A2; --focus:#E3D3C5;
}
*{box-sizing:border-box}
/* .actions и подобные задают display, а он перебивает браузерное
   правило для [hidden] — без !important скрытие не срабатывает */
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.5; -webkit-text-size-adjust:100%;
}
.wrap{max-width:37rem;margin:0 auto;padding:1.25rem 1.1rem 4rem}
h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:1.65rem;line-height:1.15;margin:0 0 .15rem;letter-spacing:-.01em}
.sub{color:var(--ink-soft);font-size:.9rem;margin:0 0 1.5rem}
h2{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:1.05rem;margin:0 0 .6rem}
h3.small{font-size:.82rem;font-family:inherit;font-weight:500;color:var(--ink-soft);
  text-transform:uppercase;letter-spacing:.06em;margin:1.1rem 0 .5rem}
.block{margin-bottom:1.5rem}

.picker{display:flex;flex-direction:column;gap:.45rem}
.opt{display:flex;align-items:center;gap:.7rem;background:var(--card);border:1px solid var(--hair);
  border-radius:.55rem;padding:.7rem .8rem;cursor:pointer;text-align:left;width:100%;
  color:inherit;font:inherit;transition:border-color .12s}
.opt:hover{border-color:var(--cocoa-soft)}
.opt[aria-pressed="true"]{border-color:var(--cocoa);box-shadow:inset 0 0 0 1px var(--cocoa)}
.opt .mark{flex:0 0 .95rem;height:.95rem;border-radius:50%;border:1.5px solid var(--hair);position:relative}
.opt[aria-pressed="true"] .mark{border-color:var(--cocoa)}
.opt[aria-pressed="true"] .mark::after{content:"";position:absolute;inset:.19rem;border-radius:50%;background:var(--cocoa)}
.opt .thumb{flex:0 0 2.9rem;height:2.9rem;border-radius:.42rem;object-fit:cover;background:var(--paper);border:1px solid var(--hair)}
.opt .body{flex:1;min-width:0}
.opt .nm{font-weight:500;display:block}
.opt .meta{color:var(--ink-soft);font-size:.82rem;display:block}
.opt .edit{flex:0 0 auto;background:none;border:none;color:var(--ink-soft);font:inherit;
  font-size:.8rem;cursor:pointer;padding:.2rem .35rem;border-radius:.3rem}
.opt .edit:hover{color:var(--cocoa);text-decoration:underline}

.seg{display:inline-flex;gap:.2rem;padding:.22rem;background:var(--card);border:1px solid var(--hair);border-radius:.5rem}
.seg button{font:inherit;font-size:.88rem;padding:.42rem .85rem;border:none;border-radius:.36rem;
  background:none;color:var(--ink-soft);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--cocoa);color:var(--card);font-weight:500}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem}
@media (min-width:34rem){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{position:relative;display:flex;flex-direction:column;background:var(--card);
  border:1px solid var(--hair);border-radius:.6rem;overflow:hidden;padding:0;width:100%;
  font:inherit;color:inherit;text-align:left;cursor:pointer;transition:border-color .12s}
.card:hover{border-color:var(--cocoa-soft)}
.card[aria-pressed="true"]{border-color:var(--cocoa);box-shadow:inset 0 0 0 1px var(--cocoa)}
.card>img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--paper)}
.card .noimg{display:flex;align-items:center;justify-content:center;aspect-ratio:1/1;
  background:var(--paper);color:var(--ink-soft);font-size:.8rem}
.card .body{padding:.55rem .62rem .68rem}
.card .nm{display:block;font-weight:500;font-size:.93rem;line-height:1.25}
.card .meta{display:block;color:var(--ink-soft);font-size:.78rem;line-height:1.35}
.card .edit{display:inline-block;margin-top:.35rem;font-size:.78rem;color:var(--cocoa-soft);cursor:pointer}
.card .edit:hover{text-decoration:underline}
.card[aria-pressed="true"]::after{content:"\2713";position:absolute;top:.45rem;right:.45rem;
  width:1.15rem;height:1.15rem;border-radius:50%;background:var(--cocoa);color:var(--card);
  font-size:.72rem;line-height:1.15rem;text-align:center}

.tabs{margin-bottom:1.4rem}
.shiftitem{display:flex;align-items:center;gap:.7rem;background:var(--card);
  border:1px solid var(--hair);border-radius:.55rem;padding:.65rem .8rem;margin-bottom:.45rem}
.shiftitem .body{flex:1;min-width:0}
.shiftitem .nm{display:block;font-weight:500;font-size:.93rem}
.shiftitem .meta{display:block;color:var(--ink-soft);font-size:.82rem}
.shiftitem .x{flex:0 0 1.9rem;background:none;border:none;color:var(--ink-soft);
  font-size:1.2rem;cursor:pointer;line-height:1;padding:.2rem;border-radius:.3rem}
.shiftitem .x:hover{color:var(--danger)}
.empty{color:var(--ink-soft);font-size:.9rem;padding:.4rem 0 1rem}

.controls{display:flex;flex-wrap:wrap;gap:.9rem}
.field{flex:1 1 8rem;min-width:7.5rem}
.field label{display:block;font-size:.82rem;color:var(--ink-soft);margin-bottom:.3rem}
.field input,.field select{width:100%;background:var(--card);color:var(--ink);border:1px solid var(--hair);
  border-radius:.45rem;padding:.5rem .55rem;font:inherit;font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:stretch}
.stepper button{width:2.6rem;background:var(--card);border:1px solid var(--hair);color:var(--ink);
  font:inherit;font-size:1.15rem;cursor:pointer}
.stepper button:first-child{border-radius:.45rem 0 0 .45rem}
.stepper button:last-child{border-radius:0 .45rem .45rem 0}
.stepper input{border-radius:0;border-left:none;border-right:none;text-align:center;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.readout{background:var(--lcd);color:var(--lcd-ink);border-radius:.6rem;padding:1.1rem 1rem .9rem;
  border:1px solid rgba(0,0,0,.14)}
.readout .head{display:flex;justify-content:space-between;align-items:baseline;gap:.6rem;margin-bottom:.4rem}
.readout .head .t{font-family:Fraunces,Georgia,serif;font-size:1.05rem;font-weight:600}
.readout .head .k{font-family:"IBM Plex Mono",monospace;font-size:.78rem;opacity:.72;white-space:nowrap}
.readout .headsub{font-size:.83rem;opacity:.78;margin:-.15rem 0 .25rem;line-height:1.35}
.layview{margin:1.1rem 0 .3rem;display:flex;align-items:baseline;gap:.5rem}
.layview .t{font-weight:600;font-size:.92rem}
.layview .r{flex:1;border-bottom:1px solid var(--hair)}
.layview .g{font-size:.82rem;color:var(--ink-soft);white-space:nowrap}
.lay{display:flex;align-items:baseline;gap:.5rem;margin:.95rem 0 .4rem}
.lay .t{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;font-weight:600;white-space:nowrap}
.lay .r{flex:1;border-bottom:1px solid currentColor;opacity:.3;transform:translateY(-.2em)}
.lay .g{font-family:"IBM Plex Mono",monospace;font-size:.8rem;opacity:.8;white-space:nowrap}
.line{display:flex;align-items:baseline;gap:.4rem;padding:.16rem 0}
.line .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.line .dots{flex:1;border-bottom:1px dotted currentColor;opacity:.4;transform:translateY(-.22em)}
.line .val{font-family:"IBM Plex Mono",monospace;font-weight:600;font-variant-numeric:tabular-nums;
  white-space:nowrap;font-size:1.02rem}
.line.total{margin-top:.75rem;padding-top:.55rem;border-top:1.5px solid currentColor}
.line.total .nm{font-weight:600}
.line.total .val{font-size:1.2rem}
.line.extra{margin-top:.5rem;opacity:.85;font-size:.92rem}
.line.extra .val{font-size:.95rem}
.hintline{font-size:.78rem;opacity:.7;margin-top:.7rem;line-height:1.35}

.actions{display:flex;gap:.5rem;margin-top:.7rem;flex-wrap:wrap}
.btn{font:inherit;font-size:.88rem;cursor:pointer;border-radius:.45rem;padding:.5rem .8rem;
  border:1px solid var(--hair);background:var(--card);color:var(--ink)}
.btn:hover{border-color:var(--cocoa-soft)}
.btn.primary{background:var(--cocoa);color:var(--paper);border-color:var(--cocoa)}
.btn.primary:hover{opacity:.9}
.btn.quiet{border-color:transparent;background:none;color:var(--ink-soft)}
.btn.quiet:hover{color:var(--ink);text-decoration:underline}
.btn.danger{color:var(--danger);border-color:transparent;background:none}
.btn.danger:hover{text-decoration:underline}

.adminbar{margin-top:2.5rem;padding-top:1rem;border-top:1px solid var(--hair);
  display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.adminbar .who{font-size:.82rem;color:var(--ink-soft);flex:1 1 12rem}
.toggle{display:flex;align-items:center;gap:.5rem;font-size:.88rem;cursor:pointer}
.toggle input{accent-color:var(--cocoa);width:1rem;height:1rem}

dialog{border:none;border-radius:.7rem;padding:0;background:var(--card);color:var(--ink);
  max-width:34rem;width:calc(100% - 1.6rem);max-height:86vh;overflow:auto}
.ac{position:relative;flex:1 1 auto;min-width:0}
.ac input{width:100%}
.ac ul{position:absolute;left:0;right:0;top:calc(100% + .2rem);z-index:9;margin:0;padding:.25rem;
  list-style:none;background:var(--card);border:1px solid var(--hair);border-radius:.45rem;
  box-shadow:0 8px 20px rgba(0,0,0,.16);max-height:11rem;overflow:auto}
.ac li{padding:.42rem .5rem;border-radius:.3rem;cursor:pointer;font-size:.9rem}
.ac li[aria-selected="true"],.ac li:hover{background:var(--paper)}
.ac li.new{color:var(--ink-soft);font-size:.84rem}
.dirrow{display:flex;align-items:center;gap:.45rem;margin-bottom:.4rem}
.dirrow input{flex:1 1 auto;min-width:0;background:var(--paper);color:var(--ink);
  border:1px solid var(--hair);border-radius:.4rem;padding:.42rem .45rem;font:inherit;font-size:1rem}
.dirrow select{flex:0 0 9rem;background:var(--paper);color:var(--ink);border:1px solid var(--hair);
  border-radius:.4rem;padding:.42rem .3rem;font:inherit;font-size:.82rem}
.dirrow .cnt{flex:0 0 2.6rem;text-align:right;color:var(--ink-soft);font-size:.8rem;
  font-variant-numeric:tabular-nums}
.repl{background:var(--paper);border:1px solid var(--hair);border-radius:.5rem;
  padding:.7rem .75rem;margin:-.1rem 0 .7rem}
.repl .q{font-size:.86rem;margin-bottom:.6rem;line-height:1.35}
.repl select,.repl input{width:100%;background:var(--card);color:var(--ink);
  border:1px solid var(--hair);border-radius:.4rem;padding:.44rem .45rem;
  font:inherit;font-size:1rem;margin-bottom:.45rem}
.repl .or{font-size:.78rem;color:var(--ink-soft);margin:.1rem 0 .35rem}
.viewpic{width:100%;max-height:11rem;object-fit:cover;border-radius:.5rem;
  margin-bottom:.9rem;background:var(--paper)}
.usedin{font-size:.84rem;color:var(--ink-soft);margin-top:.9rem;line-height:1.4}
.ta{width:100%;min-height:8.5rem;background:var(--paper);color:var(--ink);
  border:1px solid var(--hair);border-radius:.45rem;padding:.55rem;
  font:inherit;font-size:1rem;line-height:1.45;resize:vertical}
.ta.mono{font-family:"IBM Plex Mono",monospace;font-size:1rem;min-height:7rem}
.prev{background:var(--paper);border:1px solid var(--hair);border-radius:.5rem;
  padding:.7rem .75rem;margin:.8rem 0}
.prev .line{padding:.12rem 0}
.prev .tag{font-size:.72rem;color:var(--ink-soft);margin-left:.4rem}
.note{font-size:.82rem;color:var(--ink-soft);line-height:1.4;margin:.5rem 0 0}
.note.warnnote{color:var(--danger)}
dialog::backdrop{background:rgba(20,16,13,.55)}
.dlg{padding:1.1rem}
.dlg:focus{outline:none}
.dlg h3{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:1.15rem;margin:0 0 .9rem}
.photo{display:flex;align-items:center;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap}
.photo .preview{width:5.4rem;height:5.4rem;border-radius:.5rem;object-fit:cover;
  border:1px solid var(--hair);background:var(--paper)}
.photo .btn{font-size:.85rem}
.ing{display:flex;gap:.4rem;align-items:center;margin-bottom:.4rem}
.ing input[type=text]{flex:1 1 auto;min-width:0}
.ing input[type=number]{flex:0 0 4.6rem}
.ing select{flex:1 1 auto;min-width:0}
.ing select.u{flex:0 0 4.2rem}
.ing input,.ing select{background:var(--paper);color:var(--ink);border:1px solid var(--hair);
  border-radius:.4rem;padding:.42rem .45rem;font:inherit;font-size:1rem}
.ing .x{flex:0 0 1.9rem;background:none;border:none;color:var(--ink-soft);font-size:1.1rem;
  cursor:pointer;line-height:1;padding:.2rem;border-radius:.3rem}
.ing .x:hover{color:var(--danger)}
.sumline{font-size:.85rem;margin:.5rem 0 .2rem}
.sumline.ok{color:var(--ok)}
.sumline.bad{color:var(--danger)}
.dlgfoot{display:flex;gap:.5rem;margin-top:1.1rem;flex-wrap:wrap;align-items:center}
.dlgfoot .spacer{flex:1}
.err{color:var(--danger);font-size:.85rem;margin-top:.6rem}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Расчёт начинки</h1>
  <p class="sub">Выберите конфету и форму — получите граммовки по каждому слою.</p>

  <div class="seg tabs" id="tabs" role="group" aria-label="Разделы">
    <button type="button" data-tab="calc" aria-pressed="true">Расчёт</button>
    <button type="button" data-tab="shift" aria-pressed="false" id="tabShift">Смена</button>
  </div>

<div id="viewCalc">
  <section class="block">
    <h2>Что делаем</h2>
    <h3 class="small">Конфеты</h3>
    <div class="picker" id="comps"></div>
    <div class="actions" id="compAdmin" hidden>
      <button class="btn" data-act="new-comp">Добавить конфету</button>
    </div>
    <h3 class="small">Или одна начинка отдельно</h3>
    <div class="picker" id="fills"></div>
    <div class="actions" id="fillAdmin" hidden>
      <button class="btn" data-act="new-fill">Добавить начинку</button>
      <button class="btn" data-act="import">Импорт из текста</button>
      <button class="btn" data-act="dir">Справочник ингредиентов</button>
      <button class="btn quiet" data-act="backup">Резервная копия</button>
    </div>
  </section>

  <section class="block">
    <h2>Как считаем</h2>
    <div class="seg" id="modeSeg" role="group" aria-label="Способ расчёта">
      <button type="button" data-mode="form" aria-pressed="true">По форме</button>
      <button type="button" data-mode="weight" aria-pressed="false">По весу</button>
    </div>
  </section>

  <section class="block" id="formBlock">
    <h2>Форма</h2>
    <div class="grid" id="forms"></div>
    <div class="actions" id="formAdmin" hidden>
      <button class="btn" data-act="new-form">Добавить форму</button>
    </div>
  </section>

  <section class="block">
    <div class="controls">
      <div class="field" id="countField">
        <label for="count">Сколько форм</label>
        <div class="stepper">
          <button type="button" id="minus" aria-label="Меньше">&minus;</button>
          <input type="number" id="count" value="1" min="1" max="99" step="1" inputmode="numeric">
          <button type="button" id="plus" aria-label="Больше">+</button>
        </div>
      </div>
      <div class="field" id="batchField" hidden>
        <label for="batch">Нужно граммов начинки</label>
        <input type="number" id="batch" value="200" min="1" step="10" inputmode="decimal">
      </div>
      <div class="field">
        <label for="loss">Запас на потери, %</label>
        <input type="number" id="loss" value="7" min="0" max="50" step="1" inputmode="decimal">
      </div>
      <div class="field" id="corpusField">
        <label for="corpus">Корпус, % от веса</label>
        <input type="number" id="corpus" value="25" min="0" max="80" step="1" inputmode="decimal">
      </div>
    </div>
  </section>

  <section class="block">
    <div class="readout" id="readout"></div>
    <div class="actions">
      <button class="btn primary" id="addShift">Добавить в смену</button>
      <button class="btn" id="copyBtn">Скопировать</button>
      <button class="btn" id="sendBtn">Отправить в чат</button>
      <button class="btn quiet" id="resetBtn">Очистить смену</button>
    </div>
  </section>
</div>

<div id="viewShift" hidden>
  <section class="block">
    <h2>Позиции на смену</h2>
    <div id="shiftList"></div>
  </section>
  <section class="block">
    <div class="seg" id="shiftSeg" role="group" aria-label="Что показать">
      <button type="button" data-sv="buy" aria-pressed="true">Закупка</button>
      <button type="button" data-sv="cook" aria-pressed="false">Готовка</button>
    </div>
  </section>
  <section class="block">
    <div class="readout" id="shiftRead"></div>
    <div class="actions">
      <button class="btn" id="shiftCopy">Скопировать</button>
      <button class="btn" id="shiftSend">Отправить в чат</button>
      <button class="btn quiet" id="shiftClear">Очистить смену</button>
    </div>
  </section>
</div>

  <div class="adminbar">
    <span class="who" id="who"></span>
    <span class="toggle" id="saveState"></span>
    <label class="toggle"><input type="checkbox" id="adminToggle"><span>Режим администратора</span></label>
  </div>
</div>

<dialog id="dlg"><div class="dlg" id="dlgBody" tabindex="-1"></div></dialog>

<script>
(function(){

var INIT = (window.Telegram && window.Telegram.WebApp) ? (window.Telegram.WebApp.initData || "") : "";

function api(path, opts){
  opts = opts || {};
  opts.headers = Object.assign({"X-Init-Data": INIT}, opts.headers || {});
  return fetch(path, opts).then(function(r){
    return r.json().catch(function(){ return {}; }).then(function(j){
      if(!r.ok){
        var e = new Error(j.error || ("ошибка " + r.status));
        e.status = r.status; e.payload = j;
        throw e;
      }
      return j;
    });
  });
}

function status(text, bad){
  var el = document.getElementById("saveState");
  if(!el) return;
  el.textContent = text || "";
  el.style.color = bad ? "var(--danger)" : "var(--ink-soft)";
}

/* Сохранение отложенное: правки копятся и уходят одним PUT.
   rev защищает от затирания чужих изменений. */
var saveTimer = null, saving = false, dirty = false;

function save(){
  if(!booted) return;
  dirty = true;
  status("сохраняю\u2026");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 400);
}

function flush(){
  if(saving || !dirty) return;
  saving = true; dirty = false;
  api("/api/state", {
    method: "PUT",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({rev: rev, data: strip(db)})
  }).then(function(res){
    rev = res.rev;
    status("сохранено");
    saving = false;
    if(dirty) flush();
  }).catch(function(e){
    saving = false;
    if(e.status === 409 && e.payload && e.payload.data){
      rev = e.payload.rev; db = normalize(e.payload.data);
      status("данные обновил кто-то ещё, перечитал", true);
      renderAll();
      return;
    }
    dirty = true;
    status(e.status === 403 ? "только чтение, правки не сохранены" : ("не сохранилось: " + e.message), true);
  });
}

/* смена — локальная черновая штука, на сервер её не шлём */
function strip(d){
  return {ings: d.ings, fills: d.fills, comps: d.comps, forms: d.forms};
}
function normalize(d){
  d = d || {};
  return {
    ings: d.ings || [], fills: d.fills || [], comps: d.comps || [],
    forms: d.forms || [], shift: db.shift || []
  };
}
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function uid(){ return "x" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function num(v, dec){
  if(dec === undefined) dec = 1;
  var m = Math.pow(10, dec);
  return (Math.round(v*m)/m).toLocaleString("ru-RU", {maximumFractionDigits:dec});
}
function esc(s){
  return String(s).replace(/[&<>"]/g, function(m){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m];
  });
}
function yield_(f){ return f.items.reduce(function(s,i){ return s + (i.u==="г" ? i.a : 0); }, 0); }

/* нормализация: регистр, ё, дефисы и двойные пробелы не создают дублей */
function norm(s){
  return String(s || "").toLowerCase().replace(/\u0451/g, "\u0435")
    .replace(/[\s\-\u2010-\u2015]+/g, " ").trim();
}
function ingById(id){ return db.ings.filter(function(x){ return x.id === id; })[0] || null; }
function ingName(id){ var g = ingById(id); return g ? g.name : "\u2014 нет в справочнике"; }
function findIng(name){
  var k = norm(name);
  return db.ings.filter(function(x){ return norm(x.name) === k; })[0] || null;
}
/* вернуть id существующего ингредиента или завести новый */
function ensureIng(name){
  var got = findIng(name);
  if(got) return got.id;
  var rec = {id: uid(), name: String(name).trim()};
  db.ings.push(rec);
  return rec.id;
}
function ingUsage(id){
  var n = 0;
  db.fills.forEach(function(f){
    f.items.forEach(function(it){ if(it.i === id) n++; });
  });
  return n;
}
function fillById(id){ return db.fills.filter(function(x){ return x.id===id; })[0] || null; }

function row(active, name, meta, img, onPick, onEdit, onView){
  var b = document.createElement("button");
  b.className = "opt"; b.type = "button";
  b.setAttribute("aria-pressed", active ? "true" : "false");
  var mark = document.createElement("span"); mark.className = "mark";
  b.appendChild(mark);
  if(img){
    var th = document.createElement("img");
    th.className = "thumb"; th.src = img; th.alt = ""; th.loading = "lazy";
    b.appendChild(th);

  var body = document.createElement("span"); body.className = "body";

/* ---------- расчёт ---------- */
/* ядро расчёта: одинаково работает и для экрана, и для позиции смены */
function calcCore(o){
  var list = o.kind === "comp" ? db.comps : db.fills;
  var t = list.filter(function(x){ return x.id === o.id; })[0];
  if(!t) return null;
  var layers = o.kind === "fill" ? [{f:t.id, p:100}] : (t.layers || []);
  if(!layers.length) return null;

  var loss = Math.max(0, o.loss || 0) / 100;
  var fillingTotal, corpus = 0, head, pieces = 0, formName = "", formCount = 0;

  if(o.mode === "weight"){
    fillingTotal = Math.max(0, o.grams || 0);
    head = num(fillingTotal) + " г начинки";
  }else{
    var f = db.forms.filter(function(x){ return x.id === o.formId; })[0];
    if(!f) return null;
    var cnt = Math.max(1, o.count || 1);
    pieces = f.cells * cnt;
    var candy = f.cells * f.weight * cnt;
    var share = Math.min(80, Math.max(0, o.corpusPct || 0)) / 100;
    corpus = candy * share;
    fillingTotal = candy - corpus;
    head = pieces + " шт \u00b7 " + num(candy) + " г";
    formName = f.name; formCount = cnt;
  }
  fillingTotal *= (1 + loss);

  var out = [], missing = false;
  layers.forEach(function(l){
    var f = fillById(l.f);
    if(!f){ missing = true; return; }
    var base = yield_(f);
    var mass = fillingTotal * (l.p / 100);
    out.push({
      fid: f.id, name: f.name, pct: l.p, mass: mass, k: base > 0 ? mass/base : 0,
      rows: f.items.map(function(i){
        return {id:i.i, n:ingName(i.i), u:i.u, v: base > 0 ? i.a * (mass/base) : 0};
      })
    });
  });
  if(!out.length) return null;

  return {title:t.name, head:head, layers:out, total:fillingTotal, corpus:corpus,
          missing:missing, pieces:pieces, formName:formName, formCount:formCount,
          mode:o.mode};
}

function currentParams(){
  return {
    kind: sel.kind, id: sel.id, mode: mode,
    formId: sel.form,
    count: Math.max(1, parseInt(elCount.value, 10) || 1),
    grams: Math.max(0, parseFloat(elBatch.value) || 0),
    loss: Math.max(0, parseFloat(elLoss.value) || 0),
    corpusPct: Math.min(80, Math.max(0, parseFloat(elCorpus.value) || 0))
  };
}
function calc(){ return calcCore(currentParams()); }

function formLine(c){
  if(c.mode === "weight" || !c.formName) return "Расчёт по весу, без формы";
  return "Форма: " + c.formName + (c.formCount > 1 ? " \u00d7 " + c.formCount + " шт" : "");
}

function renderReadout(){
  var c = calc();
  if(!c){
    elRead.innerHTML = '<div class="head"><span class="t">Нечего считать</span></div>' +
      '<div class="hintline">Выберите конфету или начинку. У конфеты должен быть хотя бы один слой.</div>';
    return;
  }
  var h = '<div class="head"><span class="t">' + esc(c.title) + '</span>' +
          '<span class="k">' + esc(c.head) + '</span></div>' +
          '<div class="headsub">' + esc(formLine(c)) + '</div>';

  var single = c.layers.length === 1 && c.layers[0].pct === 100;
  c.layers.forEach(function(L, i){
    if(!single){
      h += '<div class="lay"><span class="t">' + (i+1) + '. ' + esc(L.name) + '</span>' +
           '<span class="r"></span><span class="g">' + num(L.pct,0) + '% \u00b7 ' + num(L.mass) + ' г</span></div>';
    }
    L.rows.forEach(function(r){
      h += '<div class="line"><span class="nm">' + esc(r.n) + '</span><span class="dots"></span>' +
           '<span class="val">' + num(r.v, r.u==="шт" ? 2 : 1) + " " + r.u + '</span></div>';
    });
  });

  h += '<div class="line total"><span class="nm">Итого начинки</span><span class="dots"></span>' +
       '<span class="val">' + num(c.total) + ' г</span></div>';
  if(c.corpus > 0){
    h += '<div class="line extra"><span class="nm">Шоколад на корпус</span><span class="dots"></span>' +
         '<span class="val">\u2248 ' + num(c.corpus) + ' г</span></div>';
  }

  var hints = [];
  if(c.missing) hints.push("Один из слоёв ссылается на удалённую начинку и пропущен.");
  if(single) hints.push("Коэффициент к рецепту \u00d7" + num(c.layers[0].k, 2) + ".");
  else hints.push("Каждый слой варится отдельно и пересчитан от своего базового выхода.");
  if(c.layers.some(function(L){ return L.rows.some(function(r){ return r.u==="шт"; }); }))
    hints.push("Штучные позиции округляйте по вкусу.");
  if(c.corpus > 0) hints.push("Шоколад корпуса в рецепты не входит, он посчитан отдельно для закупки.");
  h += '<div class="hintline">' + esc(hints.join(" ")) + '</div>';

  elRead.innerHTML = h;
}

function reportToText(o){

  o.sections.forEach(function(sec){
    if(sec.head) s += "\n" + sec.head + "\n";
    if(sec.note) s += sec.note + "\n";
    sec.rows.forEach(function(r){ s += r[0] + ": " + r[1] + "\n"; });
  });
  s += "\n";
  o.totals.forEach(function(t){ s += t[0] + ": " + t[1] + "\n"; });
  return s.trim();
}
function copyText(txt, btn, label){
  var done = function(){
    if(!btn) return;
    btn.textContent = "Скопировано";
    setTimeout(function(){ btn.textContent = label; }, 1600);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done, function(){ fb(txt, done); });
  } else fb(txt, done);
}

function fb(txt, done){

  ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); done(); }catch(e){}

}

/* ---------- поле с подсказками из справочника ---------- */
function ingInput(item){
  var wrap = document.createElement("div"); wrap.className = "ac";
  var inp = document.createElement("input");
  inp.type = "text"; inp.placeholder = "Ингредиент"; inp.autocomplete = "off";
  inp.value = item.name || "";
  wrap.appendChild(inp);
  var list = null, cur = -1, opts = [];

  function close(){ if(list){ list.remove(); list = null; cur = -1; opts = []; } }
  function pick(name){ inp.value = name; item.name = name; close(); }
  function open(){
    close();
    var q = norm(inp.value);
    var found = db.ings.filter(function(g){ return q ? norm(g.name).indexOf(q) >= 0 : true; })
                       .slice(0, 6);
    var exact = q && found.some(function(g){ return norm(g.name) === q; });
    if(!found.length && !inp.value.trim()) return;
    list = document.createElement("ul");
    opts = [];
    found.forEach(function(g){
      var li = document.createElement("li");
      li.textContent = g.name;
      li.addEventListener("mousedown", function(e){ e.preventDefault(); pick(g.name); });
      list.appendChild(li); opts.push({el:li, name:g.name});
    });
    if(inp.value.trim() && !exact){
      var li2 = document.createElement("li");
      li2.className = "new";
      li2.textContent = "\u002b Добавить \u00ab" + inp.value.trim() + "\u00bb в справочник";
      li2.addEventListener("mousedown", function(e){ e.preventDefault(); pick(inp.value.trim()); });
      list.appendChild(li2); opts.push({el:li2, name:inp.value.trim()});
    }
    if(!opts.length){ list = null; return; }
    wrap.appendChild(list);
  }
  function hl(){
    opts.forEach(function(o, i){ o.el.setAttribute("aria-selected", i === cur ? "true" : "false"); });
  }
  inp.addEventListener("input", function(){ item.name = inp.value; open(); });
  inp.addEventListener("focus", open);
  inp.addEventListener("blur", function(){ setTimeout(close, 120); });
  inp.addEventListener("keydown", function(e){
    if(!list) return;
    if(e.key === "ArrowDown"){ e.preventDefault(); cur = Math.min(opts.length-1, cur+1); hl(); }
    else if(e.key === "ArrowUp"){ e.preventDefault(); cur = Math.max(0, cur-1); hl(); }
    else if(e.key === "Enter" && cur >= 0){ e.preventDefault(); pick(opts[cur].name); }
    else if(e.key === "Escape"){ close(); }
  });
  return wrap;
}

/* ---------- разбор рецепта из текста ---------- */
/* Разбор рецепта из текстового сообщения.
   Возвращает {title, note, items:[{name,a,u}], skipped:[], warn:[]} */
function parseRecipe(text){
  var lines = String(text || "").replace(/\u00a0/g, " ").split(/\r?\n/);
  var title = "", note = "", items = [], skipped = [], warn = [];
  var titleTaken = false;

  lines.forEach(function(raw){
    var s = raw.trim();
    if(!s) return;
    s = s.replace(/^[\-\u2013\u2014\u2022*\u00b7]+\s*/, "").trim();
    if(!s) return;

    /* первая непустая строка всегда заголовок, даже если в ней есть цифры */
    if(!titleTaken){
      titleTaken = true;
      var m = s.match(/^(.*?)\s*[\(\uff08]([^\)\uff09]*)[\)\uff09]\s*$/);
      if(m){ title = m[1].trim(); note = m[2].trim(); }
      else title = s.replace(/[:\uff1a]\s*$/, "").trim();
      title = title.replace(/\s*[\-\u2013\u2014]\s*$/, "").trim();
      return;
    }

    var it = parseLine(s);
    if(it){
      if(it.warn) warn.push(it.warn);
      items.push({name:it.name, a:it.a, u:it.u});
    }else{
      skipped.push(s);
    }
  });

  return {title:title, note:note, items:items, skipped:skipped, warn:warn};
}

function toNum(s){ return parseFloat(String(s).replace(",", ".")); }

function parseLine(s){
  /* случай 1: строка кончается единицей измерения */
  var m = s.match(/^(.*?)(\d+(?:[.,]\d+)?)\s*(гр\.?|грамм(?:ов|а)?|г\.?|шт\.?|мл\.?)\s*$/i);
  if(m){
    var name = cleanName(m[1]);
    var a = toNum(m[2]);
    var raw = m[3].toLowerCase();
    var u = /шт/.test(raw) ? "шт" : "г";
    var w = null;
    if(/мл/.test(raw)) w = "«" + s + "»: миллилитры записаны как граммы.";
    if(!name || !(a > 0)) return null;
    return {name:name, a:a, u:u, warn:w};
  }

  /* случай 2: единицы нет — годится для «Цедра 1 лайма», «1 боб тонка» */
  if(s.split(/\s+/).length > 5) return null;

  var nums = [], re = /(\d+(?:[.,]\d+)?)/g, mm;
  while((mm = re.exec(s)) !== null){
    var after = s.slice(mm.index + mm[0].length);
    if(/^\s*%/.test(after)) continue;          /* 33% — часть названия */
    nums.push({v:mm[0], i:mm.index});
  }
  if(nums.length !== 1) return null;

  var n = nums[0];
  var rest = cleanName(s.slice(0, n.i) + " " + s.slice(n.i + n.v.length));
  var val = toNum(n.v);
  if(!rest || !(val > 0)) return null;
  /* число в конце строки — это вес без подписи; в начале или середине — счёт штук */
  var atEnd = (n.i + n.v.length) >= s.replace(/[\s.,;]+$/, "").length;
  var u = atEnd ? "г" : "шт";
  return {name:capFirst(rest), a:val, u:u,
          warn:"«" + s + "»: единица не указана, поставил " + u + "."};
}

function capFirst(s){
  return s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
}
function cleanName(s){
  return String(s)
    .replace(/[\s\u00a0]+/g, " ")
    .replace(/^[\s\-\u2013\u2014:,.]+|[\s\-\u2013\u2014:,.]+$/g, "")
    .trim();
}

/* ---------- просмотр базового рецепта ---------- */
function viewFill(f){
  var total = yield_(f);
  var h = '<h3>' + esc(f.name) + '</h3>';
  if(f.img) h += '<img class="viewpic" src="' + f.img + '" alt="">';
  if(f.note) h += '<p class="sub" style="margin:-.5rem 0 .9rem">' + esc(f.note) + '</p>';

  h += '<div class="readout"><div class="head"><span class="t">Базовый рецепт</span>' +
       '<span class="k">выход ' + num(total) + ' г</span></div>';
  f.items.forEach(function(it){
    h += '<div class="line"><span class="nm">' + esc(ingName(it.i)) + '</span>' +
         '<span class="dots"></span><span class="val">' +
         num(it.a, it.u === "шт" ? 2 : 1) + " " + it.u + '</span></div>';
  });
  h += '<div class="line total"><span class="nm">Итого</span><span class="dots"></span>' +
       '<span class="val">' + num(total) + ' г</span></div>';
  h += '<div class="hintline">Это исходные граммовки. На вкладке «Расчёт» они пересчитываются ' +
       'под выбранную форму и долю слоя.</div></div>';

  var used = db.comps.filter(function(c){
    return (c.layers||[]).some(function(l){ return l.f === f.id; });
  });
  if(used.length){
    h += '<p class="usedin">Входит в конфеты: ' + used.map(function(c){
      var l = (c.layers||[]).filter(function(x){ return x.f === f.id; })[0];
      return esc(c.name) + " \u2014 " + num(l.p, 0) + "%";
    }).join("; ") + '.</p>';
  }else{
    h += '<p class="usedin">Пока не входит ни в одну конфету \u2014 считается только отдельно.</p>';
  }

  h += '<div class="dlgfoot"><button class="btn primary" id="vf_close">Закрыть</button>' +
       '<span class="spacer"></span>' +
       (isAdmin ? '<button class="btn" id="vf_edit">Изменить</button>' : '') + '</div>';

  dlgBody.innerHTML = h;
  $("vf_close").addEventListener("click", closeDlg);
  if(isAdmin) $("vf_edit").addEventListener("click", function(){ closeDlg(); openFill(f); });
  showDlg();
}

/* ---------- просмотр состава конфеты ---------- */
function viewComp(c){
  var layers = c.layers || [];
  var h = '<h3>' + esc(c.name) + '</h3>';
  if(c.img) h += '<img class="viewpic" src="' + c.img + '" alt="">';
  if(c.note) h += '<p class="sub" style="margin:-.5rem 0 .9rem">' + esc(c.note) + '</p>';

  if(!layers.length){
    h += '<p class="empty">Слои не заданы.</p>';
  }else{
    h += '<div class="readout"><div class="head"><span class="t">Состав</span>' +
         '<span class="k">' + layers.length +
         (layers.length === 1 ? ' слой' : layers.length < 5 ? ' слоя' : ' слоёв') + '</span></div>';
    layers.forEach(function(l, i){
      var f = fillById(l.f);
      h += '<div class="lay"><span class="t">' + (i+1) + '. ' +
           esc(f ? f.name : "\u2014 начинка удалена") + '</span>' +
           '<span class="r"></span><span class="g">' + num(l.p, 0) + '%</span></div>';
    });
    h += '<div class="hintline">Доли считаются от массы начинки: вес конфет минус корпус.</div></div>';

    layers.forEach(function(l, i){
      var f = fillById(l.f);
      if(!f) return;
      h += '<div class="layview"><span class="t">' + (i+1) + '. ' + esc(f.name) + '</span>' +
           '<span class="r"></span><span class="g">базовый выход ' + num(yield_(f)) + ' г</span></div>';
      f.items.forEach(function(it){
        h += '<div class="line" style="opacity:.9"><span class="nm">' + esc(ingName(it.i)) + '</span>' +
             '<span class="dots"></span><span class="val" style="font-size:.95rem">' +
             num(it.a, it.u === "шт" ? 2 : 1) + " " + it.u + '</span></div>';
      });
      if(f.note) h += '<p class="usedin" style="margin-top:.4rem">' + esc(f.note) + '</p>';
    });
  }

  h += '<div class="dlgfoot"><button class="btn primary" id="vc_close">Закрыть</button>' +
       '<span class="spacer"></span>' +
       (isAdmin ? '<button class="btn" id="vc_edit">Изменить</button>' : '') + '</div>';

  dlgBody.innerHTML = h;
  $("vc_close").addEventListener("click", closeDlg);
  if(isAdmin) $("vc_edit").addEventListener("click", function(){ closeDlg(); openComp(c); });
  showDlg();
}

/* ---------- справочник: переименование и замена ---------- */
function openDir(){
  dlgBody.innerHTML =
    '<h3>Справочник ингредиентов</h3>' +
    '<p class="sub" style="margin:-.4rem 0 .9rem">Переименование подхватится во всех рецептах. ' +
    'При удалении используемого ингредиента приложение спросит, чем его заменить.</p>' +
    '<div id="dir_rows"></div>' +
    '<div class="dlgfoot"><button class="btn primary" id="dir_close">Готово</button></div>';

  function draw(){
    var box = $("dir_rows"); box.innerHTML = "";
    db.ings.slice().sort(function(a,b){ return a.name.localeCompare(b.name, "ru"); })
      .forEach(function(g){
        var used = ingUsage(g.id);
        var line = document.createElement("div"); line.className = "dirrow";

        var nm = document.createElement("input"); nm.type = "text"; nm.value = g.name;
        nm.addEventListener("change", function(){
          var v = nm.value.trim();
          if(!v){ nm.value = g.name; return; }
          var clash = findIng(v);
          if(clash && clash.id !== g.id){
            alert("Такой ингредиент уже есть. Используйте склейку, чтобы объединить их.");
            nm.value = g.name; return;
          }
          g.name = v; save(); renderAll();
        });

        var cnt = document.createElement("span");
        cnt.className = "cnt"; cnt.textContent = used ? used + "\u00d7" : "\u2014";
        cnt.title = used ? "Используется в стольких строках рецептов" : "Нигде не используется";

        var x = document.createElement("button");
        x.className = "x"; x.type = "button"; x.textContent = "\u00d7";
        x.setAttribute("aria-label", "Удалить из справочника");
        x.title = "Удалить";
        x.addEventListener("click", function(){
          if(used === 0){
            if(!confirm("Удалить \u00ab" + g.name + "\u00bb из справочника?")) return;
            db.ings = db.ings.filter(function(y){ return y.id !== g.id; });
            save(); draw(); renderAll();
            return;
          }
          askReplace(g, used, box, line);
        });

        line.appendChild(nm); line.appendChild(cnt); line.appendChild(x);
        box.appendChild(line);
      });
    if(!db.ings.length){
      var e = document.createElement("p"); e.className = "empty";
      e.textContent = "Справочник пуст. Он заполняется сам, когда вы вводите ингредиенты в рецептах.";
      box.appendChild(e);
    }
  }
  /* ингредиент используется в рецептах: спрашиваем, чем заменить */
  function askReplace(g, used, box, afterLine){
    var old = box.querySelector(".repl");
    if(old) old.remove();

    var panel = document.createElement("div"); panel.className = "repl";
    var q = document.createElement("div"); q.className = "q";
    q.textContent = "\u00ab" + g.name + "\u00bb стоит в " + used +
      (used === 1 ? " строке рецептов." : " строках рецептов.") +
      " Чем заменить его в этих рецептах?";
    panel.appendChild(q);

    var pick = document.createElement("select");
    var others = db.ings.filter(function(o){ return o.id !== g.id; })
                        .sort(function(a,b){ return a.name.localeCompare(b.name, "ru"); });
    if(others.length){
      others.forEach(function(o){
        var op = document.createElement("option"); op.value = o.id; op.textContent = o.name;
        pick.appendChild(op);
      });
    }else{
      var none = document.createElement("option");
      none.value = ""; none.textContent = "других ингредиентов пока нет"; pick.appendChild(none);
    }
    panel.appendChild(pick);

    var or = document.createElement("div"); or.className = "or"; or.textContent = "или завести новый:";
    panel.appendChild(or);

    var fresh = document.createElement("input");
    fresh.type = "text"; fresh.placeholder = "Название нового ингредиента";
    panel.appendChild(fresh);

    var err = document.createElement("div"); err.className = "err"; err.hidden = true;
    panel.appendChild(err);

    var foot = document.createElement("div"); foot.className = "actions"; foot.style.marginTop = ".3rem";
    var ok = document.createElement("button");
    ok.className = "btn primary"; ok.type = "button"; ok.textContent = "Заменить и удалить";
    var no = document.createElement("button");
    no.className = "btn quiet"; no.type = "button"; no.textContent = "Отмена";
    foot.appendChild(ok); foot.appendChild(no);
    panel.appendChild(foot);

    no.addEventListener("click", function(){ panel.remove(); });
    ok.addEventListener("click", function(){
      err.hidden = true;
      var to, name = fresh.value.trim();
      if(name){
        var clash = findIng(name);
        if(clash && clash.id === g.id){
          err.hidden = false;
          err.textContent = "Это то же самое название. Выберите другой ингредиент или напишите новое.";
          return;
        }
        to = ensureIng(name);
      }else{
        to = pick.value;
        if(!to){
          err.hidden = false;
          err.textContent = "Выберите замену из списка или впишите новое название.";
          return;
        }
      }
      db.fills.forEach(function(f){
        f.items.forEach(function(it){ if(it.i === g.id) it.i = to; });
      });
      db.ings = db.ings.filter(function(y){ return y.id !== g.id; });
      save(); draw(); renderAll();
    });

    if(afterLine.nextSibling) box.insertBefore(panel, afterLine.nextSibling);
    else box.appendChild(panel);
  }

  draw();
  $("dir_close").addEventListener("click", closeDlg);
  showDlg();
}

    '<p class="sub" style="margin:-.4rem 0 .8rem">Вставьте сообщение с рецептом целиком. ' +
    'Первая строка станет названием, остальные разберутся в ингредиенты.</p>' +
    '<textarea class="ta" id="im_t" placeholder="Ванильный ганаш&#10;&#10;Сливки 39 гр&#10;Глюкоза 7 гр&#10;..."></textarea>' +
    '<div class="actions"><button class="btn" id="im_go">Разобрать</button></div>' +
    '<div id="im_prev"></div>' +
    '<div class="dlgfoot"><button class="btn primary" id="im_save" hidden>Сохранить начинку</button>' +
    '<button class="btn quiet" id="im_cancel">Отмена</button></div>';

  var parsed = null;
  $("im_cancel").addEventListener("click", closeDlg);

  $("im_go").addEventListener("click", function(){
    parsed = parseRecipe($("im_t").value);
    var box = $("im_prev");

                            .reduce(function(s,i){ return s + i.a; }, 0);

    if(!parsed.items.length){
      box.innerHTML = '<p class="note warnnote">Ингредиенты не распознались. ' +
        'Проверьте, что каждая строка выглядит как «Сливки 39 гр».</p>';
      $("im_save").hidden = true;
      return;
    }

    var h = '<div class="prev">' +
      '<div style="font-weight:500;margin-bottom:.45rem">' + esc(parsed.title || "Без названия") + '</div>';
    parsed.items.forEach(function(i){
      var known = findIng(i.name);
      h += '<div class="line"><span class="nm">' + esc(i.name) +
           '<span class="tag">' + (known ? "в справочнике" : "новый") + '</span></span>' +
           '<span class="dots"></span><span class="val" style="font-size:.9rem">' +
           num(i.a, i.u === "шт" ? 2 : 1) + " " + i.u + '</span></div>';
    });
    h += '<div class="line total" style="border-top-color:var(--hair)">' +
         '<span class="nm">Выход</span><span class="dots"></span>' +
         '<span class="val" style="font-size:1rem">' + num(grams) + ' г</span></div></div>';

    if(parsed.note) h += '<p class="note">Заметка: ' + esc(parsed.note) + '</p>';
    if(parsed.warn.length)
      h += '<p class="note warnnote">' + esc(parsed.warn.join(" ")) + '</p>';
    if(parsed.skipped.length)
      h += '<p class="note">Пропущены строки без граммовок: ' +
           esc(parsed.skipped.map(function(x){ return "\u00ab" + x + "\u00bb"; }).join(", ")) + '</p>';
    h += '<p class="note">После сохранения всё можно поправить в редакторе начинки.</p>';

    box.innerHTML = h;
    $("im_save").hidden = !(grams > 0);
    if(!(grams > 0))
      box.innerHTML += '<p class="note warnnote">Ни одного ингредиента в граммах \u2014 ' +
        'пересчитывать будет не от чего.</p>';
  });

  $("im_save").addEventListener("click", function(){
    if(!parsed || !parsed.items.length) return;
    var rec = {
      id: uid(),
      name: parsed.title || "Начинка без названия",
      note: parsed.note || "",
      img: "",
      items: parsed.items.map(function(i){ return {i: ensureIng(i.name), a: i.a, u: i.u}; })
    };
    db.fills.push(rec);
    sel.kind = "fill"; sel.id = rec.id;
    delete elBatch.dataset.touched;
    save(); closeDlg(); renderAll();
  });

  showDlg();
}

/* ---------- резервная копия ---------- */
function openBackup(){
  var dump = JSON.stringify({
    v: 3, ings: db.ings, fills: db.fills, comps: db.comps,
    forms: db.forms.map(function(f){
      var c = {}; for(var k in f){ if(k !== "img") c[k] = f[k]; } return c;
    })
  });

  dlgBody.innerHTML =
    '<h3>Резервная копия</h3>' +
    '<p class="sub" style="margin:-.4rem 0 .8rem">Выгрузка без фотографий \u2014 ' +
    'они весят слишком много для копирования текстом.</p>' +
    '<textarea class="ta mono" id="bk_out" readonly></textarea>' +
    '<div class="actions"><button class="btn" id="bk_copy">Скопировать выгрузку</button></div>' +
    '<h3 style="margin-top:1.4rem;font-size:1rem">Загрузить копию</h3>' +
    '<textarea class="ta mono" id="bk_in" placeholder="Вставьте сюда ранее скопированную выгрузку"></textarea>' +
    '<div id="bk_msg"></div>' +
    '<div class="dlgfoot"><button class="btn primary" id="bk_load">Заменить данные</button>' +
    '<button class="btn quiet" id="bk_close">Закрыть</button></div>';

  $("bk_out").value = dump;
  $("bk_close").addEventListener("click", closeDlg);
  $("bk_copy").addEventListener("click", function(){
    copyText(dump, this, "Скопировать выгрузку");
  });

  $("bk_load").addEventListener("click", function(){
    var msg = $("bk_msg");
    var p;
    try{ p = JSON.parse($("bk_in").value); }
    catch(e){
      msg.innerHTML = '<p class="note warnnote">Это не похоже на выгрузку: текст не разбирается.</p>';
      return;
    }
    if(!p || !Array.isArray(p.fills) || !Array.isArray(p.comps) ||
       !Array.isArray(p.forms) || !Array.isArray(p.ings)){
      msg.innerHTML = '<p class="note warnnote">В выгрузке не хватает разделов. ' +
        'Нужны ингредиенты, начинки, конфеты и формы.</p>';
      return;
    }
    if(!confirm("Заменить все текущие данные загруженными? Отменить будет нельзя.")) return;
    db = {ings:p.ings, fills:p.fills, comps:p.comps, forms:p.forms, shift:[]};
    db.forms.forEach(function(f){ if(f.img === undefined) f.img = ""; });
    sel = {kind: db.comps[0] ? "comp" : "fill",
           id: (db.comps[0] || db.fills[0] || {}).id || null,
           form: (db.forms[0] || {}).id || null};
    delete elCorpus.dataset.touched; delete elBatch.dataset.touched;
    save(); closeDlg(); renderAll();
  });

  showDlg();
}

/* ---------- смена ---------- */
function shiftLabel(it){
  var c = calcCore(it);
  if(!c) return "позиция больше не считается";
  if(it.mode === "weight") return "по весу \u00b7 " + num(c.total) + " г начинки";
  var f = db.forms.filter(function(x){ return x.id === it.formId; })[0];
  return (f ? f.name : "форма удалена") + " \u00d7 " + it.count +
         " \u00b7 " + c.pieces + " шт \u00b7 " + num(c.total) + " г начинки";
}

function renderShift(){
  var box = $("shiftList");
  box.innerHTML = "";
  if(!db.shift.length){
    var p = document.createElement("p");
    p.className = "empty";
    p.textContent = "Пока пусто. Посчитайте что-нибудь на вкладке «Расчёт» и нажмите «Добавить в смену».";
    box.appendChild(p);
  }
  db.shift.forEach(function(it, idx){
    var c = calcCore(it);
    var line = document.createElement("div"); line.className = "shiftitem";
    var body = document.createElement("div"); body.className = "body";
    var n = document.createElement("span"); n.className = "nm";
    n.textContent = c ? c.title : "Удалённая позиция";
    var m = document.createElement("span"); m.className = "meta"; m.textContent = shiftLabel(it);
    body.appendChild(n); body.appendChild(m);
    var x = document.createElement("button"); x.className = "x"; x.type = "button";
    x.textContent = "\u00d7"; x.setAttribute("aria-label", "Убрать позицию");
    x.addEventListener("click", function(){ db.shift.splice(idx,1); renderAll(); });
    line.appendChild(body); line.appendChild(x);
    box.appendChild(line);
  });
  Array.prototype.forEach.call($("shiftSeg").children, function(b){
    b.setAttribute("aria-pressed", b.getAttribute("data-sv") === shiftView ? "true" : "false");
  });
  renderShiftReadout();
}

/* суммирование ингредиентов по всем позициям смены */
function shiftTotals(){
  var map = {}, order = [], filling = 0, corpus = 0, pieces = 0, broken = 0;
  db.shift.forEach(function(it){
    var c = calcCore(it);
    if(!c){ broken++; return; }
    filling += c.total; corpus += c.corpus; pieces += c.pieces;
    c.layers.forEach(function(L){
      L.rows.forEach(function(r){
        var key = r.id + "|" + r.u;
        if(!map[key]){ map[key] = {n:r.n.trim(), u:r.u, v:0}; order.push(key); }
        map[key].v += r.v;
      });
    });
  });
  var rows = order.map(function(k){ return map[k]; });
  rows.sort(function(a,b){
    if(a.u !== b.u) return a.u === "г" ? -1 : 1;
    return b.v - a.v;
  });
  return {rows:rows, filling:filling, corpus:corpus, pieces:pieces, broken:broken};
}

/* Список готовки: одинаковые начинки из разных позиций сводятся
   в один замес — варить их по отдельности незачем. */
function shiftBatches(){
  var map = {}, order = [];
  db.shift.forEach(function(it){
    var c = calcCore(it);
    if(!c) return;
    c.layers.forEach(function(L){
      if(!map[L.fid]){
        map[L.fid] = {fid:L.fid, name:L.name, mass:0, from:[]};
        order.push(L.fid);
      }
      map[L.fid].mass += L.mass;
      var tag = c.title + (c.formName ? " (" + c.formName + ")" : "");
      if(map[L.fid].from.indexOf(tag) < 0) map[L.fid].from.push(tag);
    });
  });
  return order.map(function(k){
    var b = map[k], f = fillById(b.fid);
    var base = f ? yield_(f) : 0;
    b.rows = (f && base > 0)
      ? f.items.map(function(i){ return {n: ingName(i.i), u:i.u, v: i.a * (b.mass/base)}; })
      : [];
    return b;
  }).sort(function(a,b){ return b.mass - a.mass; });
}

function renderShiftCook(){
  var el = $("shiftRead");
  var bs = shiftBatches();
  if(!bs.length){
    el.innerHTML = '<div class="head"><span class="t">Что варить</span></div>' +
      '<div class="hintline">Здесь появятся замесы: для каждой начинки один список, ' +
      'даже если она стоит в нескольких позициях смены.</div>';
    return;
  }
  var total = bs.reduce(function(s,b){ return s + b.mass; }, 0);
  var h = '<div class="head"><span class="t">Что варить</span><span class="k">' +
          bs.length + (bs.length === 1 ? ' замес' : bs.length < 5 ? ' замеса' : ' замесов') +
          '</span></div>';
  bs.forEach(function(b, i){
    h += '<div class="lay"><span class="t">' + (i+1) + '. ' + esc(b.name) + '</span>' +
         '<span class="r"></span><span class="g">' + num(b.mass) + ' г</span></div>';
    b.rows.forEach(function(r){
      h += '<div class="line"><span class="nm">' + esc(r.n) + '</span><span class="dots"></span>' +
           '<span class="val">' + num(r.v, r.u === "шт" ? 2 : 1) + " " + r.u + '</span></div>';
    });
    h += '<div class="hintline" style="margin-top:.35rem">Идёт в: ' + esc(b.from.join(", ")) + '</div>';
  });
  h += '<div class="line total"><span class="nm">Всего начинки</span><span class="dots"></span>' +
       '<span class="val">' + num(total) + ' г</span></div>';
  h += '<div class="hintline">Одна и та же начинка из разных позиций сведена в один замес.</div>';
  el.innerHTML = h;
}

function renderShiftReadout(){
  if(shiftView === "cook"){ renderShiftCook(); return; }
  var el = $("shiftRead");
  if(!db.shift.length){
    el.innerHTML = '<div class="head"><span class="t">Список закупки</span></div>' +
      '<div class="hintline">Здесь сложатся ингредиенты со всех позиций смены: сливки из трёх рецептов станут одной строкой.</div>';
    return;
  }
  var t = shiftTotals();
  var forms = {}, order = [];
  db.shift.forEach(function(it){
    var c = calcCore(it);
    if(!c || !c.formName) return;
    if(!forms[c.formName]){ forms[c.formName] = 0; order.push(c.formName); }
    forms[c.formName] += c.formCount;
  });
  var h = '<div class="head"><span class="t">Список закупки</span><span class="k">' +
          db.shift.length + ' поз. \u00b7 ' + (t.pieces ? t.pieces + ' шт' : num(t.filling) + ' г') + '</span></div>';
  h += '<div class="headsub">' + esc(order.length
        ? "Формы: " + order.map(function(n){ return n + " \u00d7 " + forms[n]; }).join(", ")
        : "Только расчёты по весу") + '</div>';
  t.rows.forEach(function(r){
    h += '<div class="line"><span class="nm">' + esc(r.n) + '</span><span class="dots"></span>' +
         '<span class="val">' + num(r.v, r.u === "шт" ? 2 : 1) + " " + r.u + '</span></div>';
  });
  h += '<div class="line total"><span class="nm">Итого начинки</span><span class="dots"></span>' +
       '<span class="val">' + num(t.filling) + ' г</span></div>';
  if(t.corpus > 0){
    h += '<div class="line extra"><span class="nm">Шоколад на корпус</span><span class="dots"></span>' +
         '<span class="val">\u2248 ' + num(t.corpus) + ' г</span></div>';
  }
  var hints = ["Строки сложены по справочнику ингредиентов, а не по совпадению текста."];
  if(t.corpus > 0) hints.push("Шоколад корпуса посчитан общим весом, без разбивки по видам.");
  if(t.broken) hints.push("Позиций с удалёнными данными: " + t.broken + " \u2014 они пропущены.");
  h += '<div class="hintline">' + esc(hints.join(" ")) + '</div>';
  el.innerHTML = h;
}

/* отправка отчёта в переписку с ботом */
function sendToChat(obj, btn){
  var label = btn ? btn.textContent : "";
  if(btn) btn.textContent = "Отправляю\u2026";
  api("/api/report", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({report: obj})
  }).then(function(){
    if(btn){
      btn.textContent = "Отправлено";
      setTimeout(function(){ btn.textContent = label; }, 1800);
    }
  }).catch(function(e){
    if(btn) btn.textContent = label;
    alert("Не отправилось: " + e.message);
  });

/* ---------- фото ---------- */
function photoControl(obj){
  var wrap = document.createElement("div"); wrap.className = "photo";
  var prev = document.createElement("img"); prev.className = "preview"; prev.alt = "";
  var lbl = document.createElement("label"); lbl.className = "btn";
  lbl.appendChild(document.createTextNode("Загрузить фото"));
  var inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*"; inp.hidden = true;
  lbl.appendChild(inp);
  var rm = document.createElement("button"); rm.type = "button"; rm.className = "btn quiet"; rm.textContent = "Убрать";
  var err = document.createElement("span"); err.className = "err"; err.style.margin = "0"; err.hidden = true;
  function sync(){
    if(obj.img){ prev.src = obj.img; prev.hidden = false; rm.hidden = false; }
    else { prev.hidden = true; rm.hidden = true; }
  }
  inp.addEventListener("change", function(){
    var file = inp.files && inp.files[0]; if(!file) return;
    err.hidden = true;
    var fr = new FileReader();
    fr.onerror = function(){ err.hidden = false; err.textContent = "Файл не прочитался."; };
    fr.onload = function(){
      var im = new Image();
      im.onerror = function(){ err.hidden = false; err.textContent = "Это не похоже на картинку."; };
      im.onload = function(){
        var s = Math.min(im.width, im.height);
        var c = document.createElement("canvas"); c.width = 460; c.height = 460;
        c.getContext("2d").drawImage(im, (im.width-s)/2, (im.height-s)/2, s, s, 0, 0, 460, 460);
        err.hidden = false; err.textContent = "Загружаю\u2026";
        c.toBlob(function(blob){
          if(!blob){ err.textContent = "Картинку не удалось обработать."; return; }
          api("/api/img", {method:"POST", headers:{"Content-Type":"image/jpeg"}, body: blob})
            .then(function(r){ obj.img = r.url; err.hidden = true; sync(); })
            .catch(function(ex){ err.textContent = "Не загрузилось: " + ex.message; });
        }, "image/jpeg", 0.82);
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
  rm.addEventListener("click", function(){ obj.img = ""; inp.value = ""; sync(); });
  wrap.appendChild(prev); wrap.appendChild(lbl); wrap.appendChild(rm); wrap.appendChild(err);
  sync();
  return wrap;
}

function openFill(r){
  var isNew = !r;
  var d = r ? clone(r) : {id:uid(), name:"", note:"", img:"", items:[{i:"",name:"",a:0,u:"г"}]};
  d.items.forEach(function(it){ if(it.name === undefined) it.name = it.i ? ingName(it.i) : ""; });
  dlgBody.innerHTML =
    '<h3>' + (isNew ? "Новая начинка" : "Начинка") + '</h3><div id="rf_photo"></div>' +
    '<div class="controls">' +
      '<div class="field" style="flex:1 1 100%"><label for="rf_n">Название</label><input id="rf_n" type="text"></div>' +
      '<div class="field" style="flex:1 1 100%"><label for="rf_note">Заметка</label><input id="rf_note" type="text"></div>' +
    '</div><div style="height:.9rem"></div><div id="rf_items"></div>' +
    '<button class="btn quiet" id="rf_add" style="padding-left:0">+ Ингредиент</button>' +
    '<div class="err" id="rf_e" hidden></div>' +
    '<div class="dlgfoot"><button class="btn primary" id="rf_save">Сохранить</button>' +
      '<button class="btn quiet" id="rf_cancel">Отмена</button><span class="spacer"></span>' +
      (isNew ? "" : '<button class="btn danger" id="rf_del">Удалить</button>') + '</div>';
  $("rf_photo").appendChild(photoControl(d));
  $("rf_n").value = d.name; $("rf_note").value = d.note || "";

  function drawItems(){
    var box = $("rf_items"); box.innerHTML = "";
    d.items.forEach(function(it, idx){
      var line = document.createElement("div"); line.className = "ing";
      var n = ingInput(it);
      var a = document.createElement("input"); a.type="number"; a.step="0.1"; a.min="0";
      a.value = it.a; a.inputMode="decimal";
      a.addEventListener("input", function(){ it.a = parseFloat(a.value) || 0; });

      });
      u.addEventListener("change", function(){ it.u = u.value; });
      var x = document.createElement("button"); x.className="x"; x.type="button";
      x.textContent="\u00d7"; x.setAttribute("aria-label","Убрать ингредиент");
      x.addEventListener("click", function(){ d.items.splice(idx,1); drawItems(); });
      line.appendChild(n); line.appendChild(a); line.appendChild(u); line.appendChild(x);
      box.appendChild(line);
    });
  }
  drawItems();
  $("rf_add").addEventListener("click", function(){ d.items.push({i:"",name:"",a:0,u:"г"}); drawItems(); });
  $("rf_cancel").addEventListener("click", closeDlg);
  $("rf_save").addEventListener("click", function(){
    d.name = $("rf_n").value.trim(); d.note = $("rf_note").value.trim();

      .filter(function(i){ return String(i.name||"").trim() && i.a > 0; })

      var e = $("rf_e"); e.hidden = false;
      e.textContent = "Нужно название и хотя бы один ингредиент в граммах."; return;
    }

    else db.fills = db.fills.map(function(x){ return x.id===d.id ? d : x; });

    save(); closeDlg(); renderAll();
  });
  if(!isNew) $("rf_del").addEventListener("click", function(){
    var used = db.comps.filter(function(c){
      return (c.layers||[]).some(function(l){ return l.f === d.id; });

      ? "Начинка \u00ab" + d.name + "\u00bb стоит в конфетах: " + used.map(function(c){return c.name;}).join(", ") +

}

function openComp(c){
  var isNew = !c;
  var d = c ? clone(c) : {id:uid(), name:"", note:"", img:"", layers:[{f:(db.fills[0]||{}).id||"", p:100}]};
  dlgBody.innerHTML =
    '<h3>' + (isNew ? "Новая конфета" : "Конфета") + '</h3><div id="cf_photo"></div>' +
    '<div class="controls">' +
      '<div class="field" style="flex:1 1 100%"><label for="cf_n">Название</label><input id="cf_n" type="text"></div>' +
      '<div class="field" style="flex:1 1 100%"><label for="cf_note">Заметка</label><input id="cf_note" type="text"></div>' +
    '</div><div style="height:.9rem"></div>' +
    '<div style="font-size:.82rem;color:var(--ink-soft);margin-bottom:.45rem">Слои снизу вверх</div>' +
    '<div id="cf_layers"></div>' +
    '<div class="actions" style="margin-top:.2rem">' +
      '<button class="btn quiet" id="cf_add" style="padding-left:0">+ Слой</button>' +
      '<button class="btn quiet" id="cf_even">Разделить поровну</button></div>' +
    '<div class="sumline" id="cf_sum"></div>' +
    '<div class="err" id="cf_e" hidden></div>' +
    '<div class="dlgfoot"><button class="btn primary" id="cf_save">Сохранить</button>' +
      '<button class="btn quiet" id="cf_cancel">Отмена</button><span class="spacer"></span>' +
      (isNew ? "" : '<button class="btn danger" id="cf_del">Удалить</button>') + '</div>';
  $("cf_photo").appendChild(photoControl(d));
  $("cf_n").value = d.name; $("cf_note").value = d.note || "";

  function sum(){ return d.layers.reduce(function(s,l){ return s + (parseFloat(l.p)||0); }, 0); }
  function drawSum(){
    var s = sum(), el = $("cf_sum");
    el.textContent = "Сумма долей: " + num(s,1) + "%" + (Math.abs(s-100) < 0.05 ? "" : " \u2014 должно быть 100%");
    el.className = "sumline " + (Math.abs(s-100) < 0.05 ? "ok" : "bad");
  }
  function drawLayers(){
    var box = $("cf_layers"); box.innerHTML = "";
    d.layers.forEach(function(l, idx){
      var line = document.createElement("div"); line.className = "ing";
      var s = document.createElement("select");
      db.fills.forEach(function(f){
        var o = document.createElement("option"); o.value = f.id; o.textContent = f.name;
        if(l.f === f.id) o.selected = true; s.appendChild(o);
      });
      if(!db.fills.length){
        var o0 = document.createElement("option"); o0.textContent = "нет начинок"; s.appendChild(o0);
      }
      s.addEventListener("change", function(){ l.f = s.value; });
      var p = document.createElement("input"); p.type="number"; p.min="0"; p.max="100"; p.step="1";
      p.value = l.p; p.inputMode="decimal";
      p.addEventListener("input", function(){ l.p = parseFloat(p.value) || 0; drawSum(); });
      var pc = document.createElement("span"); pc.textContent = "%"; pc.style.color = "var(--ink-soft)";
      var x = document.createElement("button"); x.className="x"; x.type="button";
      x.textContent="\u00d7"; x.setAttribute("aria-label","Убрать слой");
      x.addEventListener("click", function(){ d.layers.splice(idx,1); drawLayers(); drawSum(); });
      line.appendChild(s); line.appendChild(p); line.appendChild(pc); line.appendChild(x);
      box.appendChild(line);
    });
  }
  drawLayers(); drawSum();
  $("cf_add").addEventListener("click", function(){
    if(d.layers.length >= 4) return;
    d.layers.push({f:(db.fills[0]||{}).id||"", p:0});
    drawLayers(); drawSum();
  });
  $("cf_even").addEventListener("click", function(){
    var n = d.layers.length; if(!n) return;
    var base = Math.floor(1000/n)/10;
    d.layers.forEach(function(l){ l.p = base; });
    d.layers[0].p = Math.round((100 - base*(n-1))*10)/10;
    drawLayers(); drawSum();
  });
  $("cf_cancel").addEventListener("click", closeDlg);
  $("cf_save").addEventListener("click", function(){
    d.name = $("cf_n").value.trim(); d.note = $("cf_note").value.trim();
    d.layers = d.layers.filter(function(l){ return l.f && (parseFloat(l.p)||0) > 0; });
    var e = $("cf_e");
    if(!d.name || !d.layers.length){
      e.hidden = false; e.textContent = "Нужно название и хотя бы один слой с долей больше нуля."; return;
    }
    if(Math.abs(sum() - 100) > 0.05){
      e.hidden = false;
      e.textContent = "Доли слоёв должны давать ровно 100%, сейчас " + num(sum(),1) + "%."; return;
    }
    if(isNew){ db.comps.push(d); sel.kind = "comp"; sel.id = d.id; }
    else db.comps = db.comps.map(function(x){ return x.id===d.id ? d : x; });
    delete elBatch.dataset.touched;
    save(); closeDlg(); renderAll();
  });
  if(!isNew) $("cf_del").addEventListener("click", function(){
    if(!confirm("Удалить конфету \u00ab" + d.name + "\u00bb? Начинки останутся на месте.")) return;
    db.comps = db.comps.filter(function(x){ return x.id !== d.id; });
    if(sel.kind==="comp" && sel.id===d.id){
      if(db.comps.length){ sel.id = db.comps[0].id; }
      else if(db.fills.length){ sel.kind = "fill"; sel.id = db.fills[0].id; }
      else sel.id = null;
    }
    save(); closeDlg(); renderAll();
  });
  showDlg();
}

/* ---------- старт ---------- */
function boot(){
  status("загружаю\u2026");
  api("/api/state").then(function(st){
    canAdmin = !!st.isAdmin;
    isAdmin = false;                 /* включается тумблером вручную */
    rev = st.rev;
    document.getElementById("adminToggle").disabled = false;

    if(st.data){
      db = normalize(st.data);
      booted = true;
      status("");
      syncDefaults(); renderAll();
      return;
    }

    /* база пустая: первый администратор заливает стартовый набор */
    if(!canAdmin){
      db = normalize(null); booted = true;
      status("база пустая, ждём администратора", true);
      renderAll();
      return;
    }
    db = normalize(clone(SEED));
    booted = true;
    isAdmin = true;                  /* первый заход: заливаем стартовый набор */
    document.getElementById("adminToggle").checked = true;
    syncDefaults(); renderAll();
    save();
  }).catch(function(e){
    booted = false;
    status(e.message, true);
    document.getElementById("readout").innerHTML =
      '<div class="head"><span class="t">Нет связи с сервером</span></div>' +
      '<div class="hintline">' + esc(e.message) + '</div>';
  });
}

function syncDefaults(){
  if(!sel.form || !db.forms.some(function(f){ return f.id === sel.form; }))
    sel.form = db.forms[0] ? db.forms[0].id : null;
  var list = sel.kind === "comp" ? db.comps : db.fills;
  if(!sel.id || !list.some(function(x){ return x.id === sel.id; })){
    if(db.comps.length){ sel.kind = "comp"; sel.id = db.comps[0].id; }
    else if(db.fills.length){ sel.kind = "fill"; sel.id = db.fills[0].id; }
    else sel.id = null;
  }
  syncBatch();
}

if(tg){
  try{
    var u = tg.initDataUnsafe && tg.initDataUnsafe.user;
    if(u && u.first_name){
      document.getElementById("who").textContent = "Вы вошли как " + u.first_name + ".";
    }
  }catch(e){}
}else{
  document.getElementById("who").textContent =
    "Открыто вне Telegram. Права определяются сервером по подписи, здесь её нет.";
}

boot();
})();
